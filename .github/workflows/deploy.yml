name: ci to build the code and deploy war file to tomcat in different Environments

on:
  push:
    branches: 
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean project
        run: mvn clean
        
      - name: Validate with maven
        run: mvn validate
        
      - name: Compile with maven
        run: mvn compile
  
      - name: Test with maven
        run: mvn test
        
      - name: Package with maven
        run: mvn package
        
      - name: Check war file
        run: ls -lh target/
      
      - name: Deploy war to tomcat
        run: | 
          curl -v -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
          -T target/*.war \
          "http://${{ secrets.TOMCAT_HOST}}:8080/manager/text/deploy?path=/TrainBook&update=true"

