name: Build and Deploy WAR to Tomcat

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean Project
        run: mvn clean

      - name: Validate Project
        run: mvn validate

      - name: Compile Project
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Package WAR
        run: mvn package

      - name: Verify WAR File
        run: |
          ls -lh target/
          find target -name "*.war"

      - name: Debug Secret Availability
        run: |
          echo "URL exists: ${{ secrets.TOMCAT_URL != '' }}"
          echo "USER exists: ${{ secrets.TOMCAT_USER != '' }}"
          echo "PASSWORD exists: ${{ secrets.TOMCAT_PASSWORD != '' }}"

      - name: Deploy WAR to Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war" | head -1)

          echo "Deploying $WAR_FILE"

          curl -v \
            -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            -T "$WAR_FILE" \
            "${{ secrets.TOMCAT_URL }}/manager/text/deploy?path=/myapp&update=true"
