name: ci to build the code and deploy war file to tomcat in different Environments
on:
  push:
      branches: master
			
jobs:
  deploy:
    run-on: ubuntu-latest

steps:
- name: chuckout code
  uses: actions/checkout@v5

- name:  set-up jdk 17
  uses: actions/setup-jdk@v5
  with:
  distribution: 'temurin'
  java-version: '17'
			  
- name: validate with maven
  run: mvn validate
			  
- name: compile with maven
  run: mvn compile
  
- name: test with maven
  run: mvn test
			  
- name: package with maven
  run: mvn package
			  
- name: check war file
  run: ls -lh target/
		  
		
- name: deploy war to tomcat in DEV
  run: | 
    curl -v -u ${{ secrets.DEV_TOMCAT_USER }}:${{ secrets.DEV_TOMCAT_PASSWORD }} \
    -T target/TrainBook-1.0.0-SNAPSHOT.war \
    "http://${{ secrets.DEV_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"
  
- name: deploy war to tomcat in TEST
  run: | 
    curl -v -u ${{ secrets.TEST_TOMCAT_USER }}:${{ secrets.TEST_TOMCAT_PASSWORD }} \
    -T target/TrainBook-1.0.0-SNAPSHOT.war \
    "http://${{ secrets.TEST_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

- name: deploy war to tomcat in PREPROD
  run: | 
    curl -v -u ${{ secrets.PREPROD_TOMCAT_USER }}:${{ secrets.PREPROD_TOMCAT_PASSWORD }} \
    -T target/TrainBook-1.0.0-SNAPSHOT.war \
    "http://${{ secrets.PREPROD_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"
  
- name: deploy war to tomcat in PROD
  run: | 
    curl -v -u ${{ secrets.PROD_TOMCAT_USER }}:${{ secrets.PROD_TOMCAT_PASSWORD }} \
    -T target/TrainBook-1.0.0-SNAPSHOT.war \
    "http://${{ secrets.PROD_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"
