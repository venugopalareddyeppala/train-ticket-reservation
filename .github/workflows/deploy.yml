name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test
        run: mvn clean verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Verify artifact
        run: |
          pwd
          ls -lah
          find . -name "*.war"

      - name: Deploy to Tomcat DEV
        env:
          URL: ${{ secrets.TOMCAT_URL_DEV }}
          USER: ${{ secrets.TOMCAT_USER_DEV }}
          PASS: ${{ secrets.TOMCAT_PASSWORD_DEV }}
        run: |
          set -e

          WAR_FILE=$(find . -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: No WAR file found"
            exit 1
          fi

          echo "Deploying WAR: $WAR_FILE"
          echo "Tomcat URL: $URL"

          curl -v \
            -u "$USER:$PASS" \
            --fail \
            --upload-file "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo "Deployment successful"
