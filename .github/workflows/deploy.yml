name: CI Build and Deploy to Tomcat
on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
          distribution: temurin
          java-version: '17'

    - name: Validate with Maven
      run: mvn validate

    - name: Compile with Maven
      run: mvn compile

    - name: Test with Maven
      run: mvn test

    - name: Package with Maven
      run: mvn clean package
  
    - name: Upload WAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trainbook-war
        path: target/*.war

  deploy-dev:
  needs: build
  runs-on: ubuntu-latest
  environment: dev

steps:
  - uses: actions/download-artifact@v4
    with:
      name: trainbook-war
      path: target

  - name: Deploy to DEV
    run: |
      WAR_FILE=$(find target -name "*.war" | head -1)

      curl -v \
        -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
        -T "$WAR_FILE" \
        "http://${{ secrets.DEV_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

deploy-test:
needs: deploy-dev
runs-on: ubuntu-latest
environment: test

steps:
  - uses: actions/download-artifact@v4
    with:
      name: trainbook-war
      path: target

  - name: Deploy to TEST
    run: |
      WAR_FILE=$(find target -name "*.war" | head -1)

      curl -v \
        -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
        -T "$WAR_FILE" \
        "http://${{ secrets.TEST_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

deploy-preprod:
needs: deploy-test
runs-on: ubuntu-latest
environment: preprod

steps:
  - uses: actions/download-artifact@v4
    with:
      name: trainbook-war
      path: target

  - name: Deploy to PREPROD
    run: |
      WAR_FILE=$(find target -name "*.war" | head -1)

      curl -v \
        -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
        -T "$WAR_FILE" \
        "http://${{ secrets.PREPROD_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

deploy-prod:
  needs: deploy-preprod
  runs-on: ubuntu-latest
  environment: prod

steps:
  - uses: actions/download-artifact@v4
    with:
      name: trainbook-war
      path: target

  - name: Deploy to PROD
    run: |
      WAR_FILE=$(find target -name "*.war" | head -1)

      curl -v \
        -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
        -T "$WAR_FILE" \
        "http://${{ secrets.PROD_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"
