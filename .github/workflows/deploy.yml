name: CI Build and Deploy to Tomcat

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Project
        run: mvn validate

      - name: Compile Project
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build WAR Package
        run: mvn clean package

      - name: Verify Build Artifacts
        run: ls -la target/

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainbook-war
          path: target/*.war

  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: target

      - name: Deploy to DEV Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war" | head -n 1)

          curl -v \
            -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            -T "$WAR_FILE" \
            "http://${{ secrets.DEV_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: target

      - name: Deploy to TEST Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war" | head -n 1)

          curl -v \
            -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            -T "$WAR_FILE" \
            "http://${{ secrets.TEST_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

  deploy-preprod:
    name: Deploy to PREPROD
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: preprod

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: target

      - name: Deploy to PREPROD Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war" | head -n 1)

          curl -v \
            -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            -T "$WAR_FILE" \
            "http://${{ secrets.PREPROD_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

  deploy-prod:
    name: Deploy to PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: target

      - name: Deploy to PROD Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war" | head -n 1)

          curl -v \
            -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            -T "$WAR_FILE" \
            "http://${{ secrets.PROD_TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"
