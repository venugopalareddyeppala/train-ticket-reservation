name: CI with Snyk Scan

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Clean project
        run: mvn clean

      - name: Validate with Maven
        run: mvn validate

      - name: Compile with Maven
        run: mvn compile

      - name: Run tests
        run: mvn test

      - name: Package application
        run: mvn package

      - name: Check WAR file
        run: ls -lh target/

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Verify Snyk Authentication
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk whoami

      - name: Snyk Open Source Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --all-projects \
            --org=${{ vars.SNYK_ORG_ID }}

      - name: Snyk Code Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test \
            --org=${{ vars.SNYK_ORG_ID }}

      - name: Monitor Project in Snyk
        if: github.ref == 'refs/heads/master'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk monitor \
            --all-projects \
            --org=${{ vars.SNYK_ORG_ID }}
